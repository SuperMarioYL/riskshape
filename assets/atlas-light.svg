<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="RiskShape architecture: agent -> normalizer -> ledger -> grader, with PostToolUse label feedback">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
    <marker id="ah-lf" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10A37F"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- forward connectors: static base line + marching-dash data flow (A->B->C->D) -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="200" y1="160" x2="246" y2="160" marker-end="url(#ah-l)"/>
    <line x1="416" y1="160" x2="462" y2="160" marker-end="url(#ah-l)"/>
    <line x1="632" y1="160" x2="678" y2="160" marker-end="url(#ah-l)"/>
  </g>
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="200" y1="160" x2="242" y2="160" stroke="#0071E3" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="416" y1="160" x2="458" y2="160" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="632" y1="160" x2="674" y2="160" stroke="#10A37F" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- data packets along the forward flow -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M200,160 L242,160" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M416,160 L458,160" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M632,160 L674,160" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- PostToolUse label feedback: D-bottom -> C-bottom (labels write back into the ledger) -->
  <path d="M 763,200 C 763,260 547,300 547,200" fill="none" stroke="#10A37F" stroke-width="1.5" stroke-opacity="0.45" marker-end="url(#ah-lf)"/>
  <path d="M 763,200 C 763,260 547,300 547,200" fill="none" stroke="#10A37F" stroke-width="1.5" stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.8s" begin="-0.4s" repeatCount="indefinite"/>
  </path>
  <text x="655" y="296" text-anchor="middle" font-size="11" font-weight="500" fill="#0B6B53">PostToolUse labels</text>

  <!-- nodes: breathing fill-opacity, staggered -->
  <g>
    <rect x="30"  y="120" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="115" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Claude Code</text>
    <text x="115" y="174" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">agent session</text>

    <rect x="246" y="120" width="170" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="331" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">shape-normalizer</text>
    <text x="331" y="174" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">tool_name + tool_input</text>

    <rect x="462" y="120" width="170" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="547" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">ledger (sqlite)</text>
    <text x="547" y="174" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">outcome labels</text>

    <rect x="678" y="120" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="763" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">grader</text>
    <text x="763" y="174" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">P(safe) vs tau</text>
  </g>

  <!-- flow caption + decision legend -->
  <text x="440" y="44" text-anchor="middle" font-size="13" font-weight="600" fill="#1D1D1F">one process · one sqlite file · no services</text>
  <text x="200" y="100" text-anchor="middle" font-size="10" font-weight="500" fill="#6E6E73">PreToolUse → riskshape check</text>
  <text x="848" y="232" text-anchor="end" font-size="11" font-weight="600" fill="#0B6B53">auto_approve</text>
  <text x="848" y="248" text-anchor="end" font-size="11" font-weight="600" fill="#8A6D00">escalate → human</text>
</svg>
