<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" data-palette="c0e656-83e76a-f6eeac-7c8fa9024163" role="img" aria-labelledby="process-light-title process-light-desc"><title id="process-light-title">RiskShape process</title><desc id="process-light-desc">Three safe labels approve the demo shape; one unsafe label returns it to escalation at tau=0.85.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="465"><stop stop-color="#687c2f"/><stop offset=".6" stop-color="#49823b"/><stop offset="1" stop-color="#797655"/></linearGradient><radialGradient id="halo"><stop stop-color="#687c2f" stop-opacity=".22"/><stop offset="1" stop-color="#fdfef9" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ecf7cb" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#687c2f" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="465" rx="16" fill="#fdfef9"/><rect width="1000" height="465" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="199.95" rx="500.0" ry="325.5" fill="url(#halo)"/><text x="44" y="44" fill="#697969" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="44" y="84.0" fill="#222a1c" font-size="30" text-anchor="start" font-weight="400">From input to a useful result</text><path d="M254.0 237H278.0" fill="none" stroke="#687c2f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M254.0 237H278.0" class="flow" fill="none" stroke="#797655" stroke-width="2"/><rect x="44.0" y="176" width="210.0" height="122" rx="12" fill="#fcfef7" stroke="#ecf7cb"/><text x="62.0" y="207.0" fill="#222a1c" font-size="21" text-anchor="start" font-weight="400">01  Unseen</text><text x="62.0" y="236.4" fill="#222a1c" font-size="21" text-anchor="start" font-weight="400">shape</text><text x="62.0" y="259.0" fill="#697969" font-size="17" text-anchor="start" font-weight="400">escalate</text><path d="M488.0 237H512.0" fill="none" stroke="#687c2f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M488.0 237H512.0" class="flow" fill="none" stroke="#797655" stroke-width="2"/><rect x="278.0" y="176" width="210.0" height="122" rx="12" fill="#fcfef7" stroke="#ecf7cb"/><text x="296.0" y="207.0" fill="#222a1c" font-size="21" text-anchor="start" font-weight="400">02  Add 3 safe</text><text x="296.0" y="236.4" fill="#222a1c" font-size="21" text-anchor="start" font-weight="400">labels</text><text x="296.0" y="259.0" fill="#697969" font-size="17" text-anchor="start" font-weight="400">auto_approve</text><path d="M722.0 237H746.0" fill="none" stroke="#687c2f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M722.0 237H746.0" class="flow" fill="none" stroke="#797655" stroke-width="2"/><rect x="512.0" y="176" width="210.0" height="122" rx="12" fill="#fcfef7" stroke="#ecf7cb"/><text x="530.0" y="207.0" fill="#222a1c" font-size="21" text-anchor="start" font-weight="400">03  Add unsafe</text><text x="530.0" y="236.4" fill="#222a1c" font-size="21" text-anchor="start" font-weight="400">label</text><text x="530.0" y="259.0" fill="#697969" font-size="17" text-anchor="start" font-weight="400">ratio falls to</text><text x="530.0" y="282.8" fill="#697969" font-size="17" text-anchor="start" font-weight="400">0.75</text><rect x="746.0" y="176" width="210.0" height="122" rx="12" fill="#fcfef7" stroke="#ecf7cb"/><text x="764.0" y="207.0" fill="#222a1c" font-size="21" text-anchor="start" font-weight="400">04  Check</text><text x="764.0" y="236.4" fill="#222a1c" font-size="21" text-anchor="start" font-weight="400">privileged</text><text x="764.0" y="259.0" fill="#697969" font-size="17" text-anchor="start" font-weight="400">still escalate</text><text x="44" y="379.0" fill="#797655" font-size="20" text-anchor="start" font-weight="400">Three safe labels approve the demo shape; one unsafe label returns it to</text><text x="44" y="407.0" fill="#797655" font-size="20" text-anchor="start" font-weight="400">escalation at tau=0.85.</text></svg>
