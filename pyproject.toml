[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "riskshape"
version = "0.4.0"
description = "Risk-graded consent ledger that learns which agent action-shapes are safe to auto-approve."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SuperMarioYL" }]
keywords = ["agents", "consent", "claude-code", "mcp", "hitl", "safety", "permissions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "mcp>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
riskshape = "riskshape.cli:main"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/riskshape"
Issues = "https://github.com/SuperMarioYL/riskshape/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/riskshape"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "README.en.md", "LICENSE", "VERSION", "assets", "docs", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
